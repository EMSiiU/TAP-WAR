<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 858" width="1080" height="858" role="img" aria-labelledby="title desc">
  <title id="title">Plano de la arena</title>
  <desc id="desc">Arena de 1024 por 768. Cuatro apariciones y un obstáculo de 160 por 128.</desc>
  <rect width="1080" height="858" fill="#101827"/>
  <g transform="translate(28 56)" font-family="system-ui, sans-serif" font-size="20" fill="#f1f5f9">
    <text x="0" y="-22" font-size="24" font-weight="700">Arena · 1024 × 768 unidades</text>
    <rect x="0" y="0" width="1024" height="768" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <rect x="14" y="14" width="996" height="740" fill="none" stroke="#94a3b8" stroke-dasharray="8 8"/>
    <text x="28" y="46">(0, 0) · X → · Y ↓</text>
    <rect id="obstacle" x="432" y="320" width="160" height="128" rx="0" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="512" y="366" font-weight="700">Obstáculo</text>
      <text x="512" y="395">160 × 128</text>
      <text x="512" y="425" font-size="17">(432, 320)</text>
      <circle class="spawn" cx="240" cy="160" r="14" fill="#38bdf8"/>
      <text x="240" y="137">1 · (240, 160)</text>
      <circle class="spawn" cx="784" cy="160" r="14" fill="#38bdf8"/>
      <text x="784" y="137">2 · (784, 160)</text>
      <circle class="spawn" cx="240" cy="608" r="14" fill="#38bdf8"/>
      <text x="240" y="585">3 · (240, 608)</text>
      <circle class="spawn" cx="784" cy="608" r="14" fill="#38bdf8"/>
      <text x="784" y="585">4 · (784, 608)</text>
    </g>
    <text x="28" y="729" font-size="18" fill="#cbd5e1">Línea discontinua · límite para el centro del jugador</text>
  </g>
</svg>
