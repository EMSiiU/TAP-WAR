name: Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'supabase/scripts/bootstrap-legacy-migrations.mjs'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo simular (dry-run) sin aplicar cambios en la base remota'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-migrations-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: '3.4.0'

      - name: Validar secretos requeridos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for var in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Falta el secreto $var en GitHub Repository Secrets."
              exit 1
            fi
          done
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{10,40}$ ]]; then
            echo "::error::SUPABASE_PROJECT_REF no tiene formato de ID de proyecto valido."
            exit 1
          fi

      - name: Vincular proyecto remoto de Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Sincronizar historial de migraciones heredadas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node supabase/scripts/bootstrap-legacy-migrations.mjs

      - name: Aplicar migraciones pendientes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            supabase db push --remote --dry-run --include-all --yes
          else
            supabase db push --remote --yes --include-all
          fi

      - name: Listar estado de migraciones remotas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --remote
